<!doctype html>
<html lang="{{raw:lang.code}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{sv.title}}</title>
<style>
  /* Embedded in the SF3D app (iframe srcdoc): any skinned model's skeleton - its joints and bones by chains, their
     names, the skin painted by the bone leading each vertex or by one bone's weight, a joint turned to check the
     skin, the model's clips. The same look as the markup editor. */
  :root { --bg:#ece8e1; --panel:#f6f3ee; --stage:#cfc8bc; --fg:#231d17; --muted:#6b6258; --line:#d0c9bd; --accent:#a8451d;
          --accent-fg:#fff6ec; --ok:#2f7d4f; --ui:"Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Consolas,monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15110d; --panel:#1e1913; --stage:#0f0c09;
    --fg:#eadfca; --muted:#a39580; --line:#352d23; --accent:#d9622f; --accent-fg:#1a0e06; --ok:#5fbf86; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#15110d; --panel:#1e1913; --stage:#0f0c09; --fg:#eadfca; --muted:#a39580; --line:#352d23;
    --accent:#d9622f; --accent-fg:#1a0e06; --ok:#5fbf86; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:13px/1.4 var(--ui); padding:10px; }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:10px; height:100%; min-height:520px; }
  @media (max-width: 760px) { .wrap { grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto; height:auto; } .stage { min-height:60vh; } }
  .main { display:flex; flex-direction:column; gap:8px; min-height:0; min-width:0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:6px 8px; }
  .seg { display:inline-flex; }
  .seg button { border-radius:0; margin-left:-1px; } .seg button:first-child { border-radius:7px 0 0 7px; margin-left:0; }
  .seg button:last-child { border-radius:0 7px 7px 0; }
  .sep { width:1px; align-self:stretch; background:var(--line); margin:0 2px; }
  .stage { position:relative; flex:1; background:var(--stage); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-height:320px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; font:11px var(--mono); color:#fff; background:rgba(0,0,0,.55); padding:1px 5px; border-radius:4px; white-space:nowrap;
    transform:translate(8px,-50%); }
  .badge { position:absolute; left:10px; top:8px; font:12px var(--mono); color:var(--muted); background:color-mix(in srgb,var(--panel) 85%,transparent);
    padding:3px 8px; border-radius:6px; pointer-events:none; }
  .tip { position:absolute; font:12px var(--mono); background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px;
    padding:2px 7px; pointer-events:none; white-space:nowrap; }
  .msg { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); padding:16px; text-align:center; }
  [hidden] { display:none !important; }
  .rail { display:flex; flex-direction:column; gap:8px; min-height:0; overflow:auto; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px; min-width:0; }
  .grp { font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:2px 0 6px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  button { font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:7px; padding:5px 8px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 5px; max-width:100%; }
  label.chk { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .small { color:var(--muted); font-size:12px; }
  .warn { color:var(--accent); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid rgba(0,0,0,.35); flex:none; }
  .legend { display:grid; gap:2px; font-size:12px; }
  .legend .it { display:flex; justify-content:space-between; gap:6px; cursor:pointer; padding:1px 4px; border-radius:5px; }
  .legend .it:hover { background:color-mix(in srgb,var(--accent) 12%,transparent); }
  .legend .n { font:11px var(--mono); color:var(--muted); }
  .tree { display:grid; gap:1px; max-height:260px; overflow:auto; font:12px var(--mono); }
  .tree .b { text-align:left; border:0; border-radius:5px; padding:1px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tree .b.sel { background:color-mix(in srgb,var(--accent) 25%,transparent); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 8px; font-size:12px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .ramp { height:8px; border-radius:4px; background:linear-gradient(90deg,#1b2a6b,#1f8fd0,#33c46a,#f2d72c,#e5452f); margin:4px 0 2px; }
  button.primary { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .pts { display:grid; gap:3px; }
  .pts button { text-align:left; display:flex; align-items:center; }
  .pts button.sel { background:color-mix(in srgb,var(--accent) 22%,transparent); }
  input[type=range] { width:100%; }
  .status { font:12px var(--mono); color:var(--muted); margin-top:6px; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="toolbar">
      <div class="seg" id="modes" hidden>
        <button data-m="view" class="on">{{sv.mode_view}}</button><button data-m="joints">{{sv.mode_joints}}</button><button data-m="mouth">{{sv.mode_mouth}}</button>
      </div>
      <div class="sep" id="modesSep" hidden></div>
      <div class="seg" id="views">
        <button data-v="front">{{sv.front}}</button><button data-v="side">{{sv.side}}</button><button data-v="top">{{sv.top}}</button><button data-v="back">{{sv.back}}</button>
      </div>
      <div class="sep"></div>
      <label class="chk"><input type="checkbox" id="xray" checked> {{sv.xray}}</label>
      <label class="chk"><input type="checkbox" id="labels"> {{sv.labels}}</label>
      <div class="sep"></div>
      <label class="chk">{{sv.paint}}
        <select id="paint">
          <option value="model">{{sv.paint_model}}</option>
          <option value="lead">{{sv.paint_lead}}</option>
          <option value="weight">{{sv.paint_weight}}</option>
        </select></label>
      <div class="sep"></div>
      <button id="reset" title="{{sv.reset_tip}}">{{sv.reset}}</button>
      <button id="keepPose" class="primary" hidden title="{{sv.keep_pose_tip}}">{{sv.keep_pose}}</button>
      <span class="status" id="kStatus" style="margin:0"></span>
    </div>
    <div class="stage" id="stage">
      <div class="labels" id="labelLayer"></div>
      <div class="badge" id="badge"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="msg" id="msg">{{sv.loading}}</div>
    </div>
  </div>
  <div class="rail">
    <div class="box">
      <div class="grp" id="title">{{sv.title}}</div>
      <div id="stats" class="small"></div>
    </div>
    <div class="box" id="jawBox" hidden>
      <div class="grp">{{sv.jaw_live}}</div>
      <input type="range" id="jawLive" min="0" max="1" step="0.01" value="0">
      <div class="row small" style="justify-content:space-between"><span>{{sv.as_made}}</span><span>{{sv.closed}}</span></div>
    </div>
    <div class="box" id="jointsBox" hidden>
      <div class="grp">{{sv.mode_joints}}</div>
      <div class="small">{{sv.joints_hint}}</div>
      <div class="row" style="margin-top:6px">
        <label class="chk"><input type="checkbox" id="sym" checked> {{sv.sym}}</label>
        <label class="chk">{{sv.reweight}} <select id="reweight"><option value="local">{{sv.rw_local}}</option><option value="all">{{sv.rw_all}}</option><option value="none">{{sv.rw_none}}</option></select></label>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="centre" disabled title="{{sv.centre_tip}}">{{sv.centre}}</button>
        <button id="undoAll">{{sv.undo_all}}</button>
      </div>
      <div class="row" style="margin-top:6px"><button id="rebuild" class="primary">{{sv.rebuild}}</button></div>
      <div class="status" id="jStatus"></div>
    </div>
    <div class="box" id="mouthBox" hidden>
      <div class="grp">{{sv.mode_mouth}}</div>
      <div class="small">{{sv.mouth_hint}}</div>
      <div class="pts" id="mouthPts" style="margin-top:6px"></div>
      <div class="small" id="mouthAngle" style="margin-top:6px"></div>
      <div style="margin-top:6px">{{sv.close_try}}</div>
      <input type="range" id="mouthClose" min="0" max="1" step="0.01" value="0">
      <div class="row" style="margin-top:6px"><button id="rejaw" class="primary">{{sv.rejaw}}</button></div>
      <div class="status" id="mStatus"></div>
    </div>
    <div class="box">
      <div class="grp">{{sv.chains}}</div>
      <div class="legend" id="legend"></div>
      <div class="small" style="margin-top:4px">{{sv.chains_hint}}</div>
    </div>
    <div class="box">
      <div class="grp">{{sv.joint}}</div>
      <div id="selNone" class="small">{{sv.pick_hint}}</div>
      <div id="selBox" hidden>
        <div class="kv" id="selKv"></div>
        <div class="row" style="margin-top:6px">
          <button id="selParent">{{sv.parent}}</button>
          <button id="selClear">{{sv.deselect}}</button>
        </div>
        <div class="small" style="margin-top:6px">{{sv.turn_hint}}</div>
        <div id="rampBox" hidden><div class="ramp"></div><div class="row small" style="justify-content:space-between"><span>0</span><span>0.5</span><span>1</span></div></div>
      </div>
    </div>
    <div class="box">
      <div class="grp">{{sv.bones}}</div>
      <div class="tree" id="tree"></div>
    </div>
    <div class="box" id="clipBox" hidden>
      <div class="grp">{{sv.clips}}</div>
      <div class="row"><select id="clip" style="flex:1"></select><button id="play">▶</button></div>
    </div>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const DATA = @@DATA@@;
const GLB = "@@GLB@@";
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- chains: what a bone is, by its name
// creature names (blender_creature_auto.py): hips, spine_01.., chest, head, snout, jaw, leg_FL_1.., tail_01..;
// Mixamo (mixamorig:LeftArm), Godot humanoid (LeftUpperArm), Unreal (upperarm_l); anything else - by the skeleton's
// own branches (each chain from a fork to a tip its own colour)
const GROUPS = {
  FL: ['#2f6fe0', '{{js:sv.g_fl}}'], FR: ['#1fb5d8', '{{js:sv.g_fr}}'], BL: ['#22a352', '{{js:sv.g_bl}}'], BR: ['#93c83a', '{{js:sv.g_br}}'],
  armL: ['#2f6fe0', '{{js:sv.g_arm_l}}'], armR: ['#22a352', '{{js:sv.g_arm_r}}'], handL: ['#8fb4f2', '{{js:sv.g_hand_l}}'], handR: ['#8ed39f', '{{js:sv.g_hand_r}}'],
  legL: ['#5a4fd6', '{{js:sv.g_leg_l}}'], legR: ['#169c8f', '{{js:sv.g_leg_r}}'],
  body: ['#e39b20', '{{js:sv.g_body}}'], neck: ['#f07f2e', '{{js:sv.g_neck}}'], head: ['#d93a2f', '{{js:sv.g_head}}'],
  jaw: ['#e0478f', '{{js:sv.g_jaw}}'], face: ['#f19bc4', '{{js:sv.g_face}}'], eye: ['#e8cf2a', '{{js:sv.g_eye}}'],
  tail: ['#9b4fd6', '{{js:sv.g_tail}}'], wing: ['#4fa3d6', '{{js:sv.g_wing}}'], other: ['#8a8f98', '{{js:sv.g_other}}'],
};
function groupOf(name) {
  const n = name.replace(/^mixamorig\d*:?/i, '');
  let m = /^leg_(FL|FR|BL|BR)/i.exec(n);
  if (m) return m[1].toUpperCase();
  if (/tail/i.test(n)) return 'tail';
  if (/wing/i.test(n)) return 'wing';
  if (/jaw|chin/i.test(n)) return 'jaw';
  if (/eye/i.test(n)) return 'eye';
  if (/lip|tongue|teeth|brow|lid|cheek|mouth/i.test(n)) return 'face';
  if (/head|snout|skull|muzzle|nose|horn|(^|[._])ear/i.test(n)) return 'head';   // (not «ForeArm»'s «eAr»)
  if (/neck/i.test(n)) return 'neck';
  const side = /left|(^|[._])l($|[._])|_l\d*$/i.test(n) ? 'L' : /right|(^|[._])r($|[._])|_r\d*$/i.test(n) ? 'R' : '';
  if (side && /thumb|index|middle|ring|pinky|finger|metacarpal/i.test(n)) return 'hand' + side;
  if (side && /arm|shoulder|clavicle|hand|wrist|elbow/i.test(n)) return 'arm' + side;
  if (side && /leg|thigh|calf|knee|foot|toe|heel|ankle|shin|ball/i.test(n)) return 'leg' + side;
  if (/hips|pelvis|spine|chest|root|torso|body|waist/i.test(n)) return 'body';
  return 'other';
}

// ---------------------------------------------------------------- scene
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
scene.background = new THREE.Color(dark ? 0x0f0c09 : 0xcfc8bc);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444034, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 3);
scene.add(sun);
const gizmo = new TransformControls(camera, renderer.domElement);
gizmo.setMode('rotate');
gizmo.setSpace('local');
gizmo.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; dragging = e.value; });
scene.add(gizmo);
let dragging = false;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// ---------------------------------------------------------------- the model
let root = null, meshes = [], bones = [], H = 1, center = new THREE.Vector3(), mixer = null, clips = [], action = null;
const info = new Map();   // bone -> {i, group, color, parent, kids, depth, sphere, segs, label, li}
const rest = new Map();   // bone -> its rest quaternion
let selected = null;

function b64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }

new GLTFLoader().parse(b64(GLB), '', (gltf) => {
  root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  root.traverse((o) => {
    if (o.isMesh) { meshes.push(o); box.expandByObject(o); o.userData.mat = o.material; o.frustumCulled = false; }   // (posed, a skinned mesh's rest box would cull it)
  });
  if (box.isEmpty()) box.setFromObject(root);
  H = Math.max(box.max.y - box.min.y, box.max.x - box.min.x, box.max.z - box.min.z, 1e-3);
  box.getCenter(center);
  // the bones: every skinned mesh's skeleton, in the order of a walk from the roots (parents first)
  const seen = new Set();
  meshes.filter((m) => m.isSkinnedMesh).forEach((m) => m.skeleton.bones.forEach((b) => seen.add(b)));
  root.traverse((o) => { if (o.isBone) seen.add(o); });
  const roots = [...seen].filter((b) => !(b.parent && b.parent.isBone && seen.has(b.parent)));
  const walk = (b, depth) => { bones.push(b); info.set(b, { depth }); b.children.filter((c) => c.isBone && seen.has(c)).forEach((c) => walk(c, depth + 1)); };
  roots.forEach((r) => walk(r, 0));
  bones.forEach((b) => rest.set(b, b.quaternion.clone()));
  build();
  clips = gltf.animations || [];
  if (clips.length) {
    mixer = new THREE.AnimationMixer(root);
    $('clip').innerHTML = `<option value="">{{js:sv.clip_none}}</option>` + clips.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join('');
    $('clipBox').hidden = false;
    // a clip asked for (its name's end: «walk» -> fox_walk): chosen and played
    const want = DATA.play && clips.findIndex((c) => c.name.toLowerCase().endsWith(DATA.play));
    if (want != null && want >= 0) { $('clip').value = String(want); setTimeout(play, 300); }
  }
  $('msg').hidden = true;
  view('front');
  setPaint();
  const jaw = bones.find((b) => b.name === 'jaw');
  $('jawBox').hidden = !(jaw && DATA.close_deg);
  if (EDIT) { initEdit(); root.updateMatrixWorld(true); bones.forEach((b) => restW.set(b, b.getWorldQuaternion(new THREE.Quaternion()))); }
}, (err) => { $('msg').textContent = '{{js:sv.load_failed}} ' + (err && err.message || err); });

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// ---------------------------------------------------------------- joints, bones, labels, the lists
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const segGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
const overlay = new THREE.Group();
scene.add(overlay);

function build() {
  // chains by the names; bones no name tells get their branch's colour (a fork to a tip: one chain)
  let branch = 0;
  const branchOf = new Map();
  bones.forEach((b) => {
    const p = b.parent && info.has(b.parent) ? b.parent : null;
    const kids = b.children.filter((c) => info.has(c));
    const forkAbove = !p || p.children.filter((c) => info.has(c)).length > 1;
    branchOf.set(b, forkAbove ? branch++ : branchOf.get(p));
    Object.assign(info.get(b), { i: bones.indexOf(b), parent: p, kids, group: groupOf(b.name) });
  });
  const hues = [210, 140, 35, 280, 0, 180, 60, 320, 100, 250];
  bones.forEach((b) => {
    const I = info.get(b);
    I.color = I.group === 'other' ? new THREE.Color().setHSL(hues[branchOf.get(b) % hues.length] / 360, .55, .55)
      : new THREE.Color(GROUPS[I.group][0]);
    const small = /hand|face|eye/.test(I.group);
    const s = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: I.color, depthTest: false, transparent: true, opacity: .95 }));
    s.scale.setScalar(H * (small ? .006 : .011));
    s.renderOrder = 10;
    overlay.add(s);
    I.sphere = s;
    I.segs = I.kids.map(() => {
      const c = new THREE.Mesh(segGeo, new THREE.MeshBasicMaterial({ color: I.color, depthTest: false, transparent: true, opacity: .7 }));
      c.renderOrder = 9;
      overlay.add(c);
      return c;
    });
    const l = document.createElement('div');
    l.className = 'lbl';
    l.textContent = b.name.replace(/^mixamorig\d*:?/i, '');
    l.hidden = true;
    $('labelLayer').appendChild(l);
    I.label = l;
  });
  // the legend: each chain, how many bones; a click picks its first bone
  const count = {};
  bones.forEach((b) => { const g = info.get(b).group; (count[g] = count[g] || []).push(b); });
  $('legend').innerHTML = Object.keys(GROUPS).filter((g) => count[g]).map((g) =>
    `<div class="it" data-g="${g}"><span><span class="sw" style="background:${GROUPS[g][0]}"></span>${GROUPS[g][1]}</span><span class="n">${count[g].length}</span></div>`).join('');
  $('legend').querySelectorAll('.it').forEach((el) => el.onclick = () => pick(count[el.dataset.g][0]));
  // the tree: indented by depth
  $('tree').innerHTML = bones.map((b, i) => {
    const I = info.get(b);
    return `<button class="b" data-i="${i}" style="padding-left:${4 + Math.min(I.depth, 14) * 10}px"><span class="sw" style="background:#${I.color.getHexString()}"></span>${esc(b.name.replace(/^mixamorig\d*:?/i, ''))}</button>`;
  }).join('');
  $('tree').querySelectorAll('.b').forEach((el) => { el.onclick = () => pick(bones[+el.dataset.i]); info.get(bones[+el.dataset.i]).li = el; });
  stats(count);
}

function stats(count) {
  const legs = ['FL', 'FR', 'BL', 'BR'].filter((g) => count[g]);
  const lines = [];
  lines.push(`{{js:sv.n_bones}} <b>${bones.length}</b>` + (DATA.kind ? ` · ${esc(DATA.kind)}` : ''));
  if (legs.length) lines.push(`{{js:sv.n_paws}} ${legs.length} (${legs.map((g) => count[g].length).join(' / ')})`);
  if (count.tail) lines.push(`{{js:sv.n_tail}} ${count.tail.length}`);
  lines.push(`{{js:sv.head_jaw}} ${count.head ? '✓' : '—'} / ${count.jaw ? '✓' : '—'}`);
  // vertices the skin barely holds (their weights sum to less than a half): they stay behind when the bones move
  let verts = 0, loose = 0;
  meshes.filter((m) => m.isSkinnedMesh).forEach((m) => {
    const w = m.geometry.attributes.skinWeight;
    verts += w.count;
    for (let i = 0; i < w.count; i++) if (w.getX(i) + w.getY(i) + w.getZ(i) + w.getW(i) < .5) loose++;
  });

function jawWeights(r, w) {   // blender_creature_finish.py's: the rule, loose pieces whole by their centre, the skin
  const T = topo(r), n = r.pos.length / 3, out = new Float32Array(n), P = r.pos;   // reached from the lower front
  for (let i = 0; i < n; i++) out[i] = w(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]);
  const cen = new Map();
  for (let i = 0; i < n; i++) {
    const c = T.of[i];
    if (T.sizes[c] > 2000) continue;
    if (!cen.has(c)) cen.set(c, [0, 0, 0, 0]);
    const a = cen.get(c); a[0] += P[i * 3]; a[1] += P[i * 3 + 1]; a[2] += P[i * 3 + 2]; a[3]++;
  }
  const piece = new Map();
  cen.forEach((a, c) => piece.set(c, w.piece(a[0] / a[3], a[1] / a[3], a[2] / a[3])));
  let start = -1, bd = Infinity;
  const L = mouth.lower;
  for (let i = 0; i < n; i++) {
    const c = T.of[i];
    if (T.sizes[c] <= 2000) { const pw = piece.get(c); if (pw != null) out[i] = pw; continue; }
    if (out[i] > 0) { const d = (P[i * 3] - mk.cx) ** 2 + (P[i * 3 + 1] - L.y) ** 2 + (P[i * 3 + 2] - L.z) ** 2; if (d < bd) { bd = d; start = i; } }
  }
  if (start >= 0) {   // the skin itself: only what is reached from the jaw's front over the skin below the line
    const reach = new Uint8Array(n), st = [T.rep[start]];
    reach[T.rep[start]] = 1;
    while (st.length) { const a = st.pop(); for (const b of T.adj.get(a) || []) if (!reach[b] && out[b] > 0) { reach[b] = 1; st.push(b); } }
    for (let i = 0; i < n; i++) if (T.sizes[T.of[i]] > 2000 && out[i] > 0 && !reach[T.rep[i]]) out[i] = 0;
  }
  return out;
}
function buildPreview() {   // every skinned mesh's copy at rest, painted by the jaw's weight
  preview = new THREE.Group();
  rests.forEach((r) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(r.pos.slice(), 3));
    if (r.geo.index) g.setIndex(r.geo.index);
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(r.pos.length), 3));
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: .8 }));
    m.userData.rest = r.pos;
    preview.add(m);
  });
  scene.add(preview);
}
function closeTurn() {   // the turn (radians, about +X through the hinge) taking the lower front onto the upper one
  const a = (p) => Math.atan2(p.z - mouth.hinge.z, p.y - mouth.hinge.y);
  let t = a(mouth.upper) - a(mouth.lower);
  while (t > Math.PI) t -= 2 * Math.PI;
  while (t < -Math.PI) t += 2 * Math.PI;
  return t;
}
function mouthPaint() {
  if (!preview) return;
  const w = jawRule(), t = closeTurn() * +$('mouthClose').value, h = mouth.hinge, c = Math.cos(t), s = Math.sin(t);
  const red = new THREE.Color('#e5452f'), grey = new THREE.Color('#bdb6aa'), k = new THREE.Color();
  let n = 0;
  preview.children.forEach((m, mi) => {
    const R = m.userData.rest, pos = m.geometry.attributes.position, col = m.geometry.attributes.color, W = jawWeights(rests[mi], w);
    for (let i = 0; i < pos.count; i++) {
      const x = R[i * 3], y = R[i * 3 + 1], z = R[i * 3 + 2], wt = W[i];
      if (wt > 0) n++;
      // skinned as the jaw would be: turned by the weight's share (about X through the hinge)
      const dy = y - h.y, dz = z - h.z, ry = h.y + dy * c - dz * s, rz = h.z + dy * s + dz * c;
      pos.setXYZ(i, x, y + (ry - y) * wt, z + (rz - z) * wt);
      k.copy(grey).lerp(red, wt);
      col.setXYZ(i, k.r, k.g, k.b);
    }
    pos.needsUpdate = col.needsUpdate = true;
    m.geometry.computeVertexNormals();
    m.material.opacity = $('xray').checked ? .55 : 1;
    m.material.transparent = $('xray').checked;
  });
  $('mouthAngle').textContent = '{{js:sv.opening}} ' + Math.abs(THREE.MathUtils.radToDeg(closeTurn())).toFixed(1) + '° · {{js:sv.jaw_verts}} ' + n;
  // the lines: the mouth line (gap -> corner -> hinge) and the jaw's two sides from the hinge
  mouthLines.clear();
  const gap = mouth.upper.clone().add(mouth.lower).multiplyScalar(.5);
  const line = (a, b, color) => {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color, depthTest: false, transparent: true }));
    l.renderOrder = 11;
    mouthLines.add(l);
  };
  line(gap, mouth.corner, '#ffffff'); line(mouth.corner, mouth.hinge, '#ffffff');
  line(mouth.hinge, mouth.upper, MCOL.upper); line(mouth.hinge, mouth.lower, MCOL.lower);
}
$('mouthClose').oninput = mouthPaint;
$('xray').addEventListener('change', () => { if (mode === 'mouth') mouthPaint(); });

// ---- sent to SF3D: the skeleton and the weights made again, or only the jaw (the answer: the log under the buttons
// above, and this markup opened again on the new model)
function send(req, out) {
  try {
    const doc = window.parent.document;
    const ta = doc.querySelector('#' + DATA.req_target + ' textarea');
    ta.value = JSON.stringify(req);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    setTimeout(() => doc.querySelector('#' + DATA.req_go).click(), 400);
    out.textContent = '{{js:sv.sent}}';
  } catch (e) { out.textContent = '{{js:sv.send_failed}} ' + e.message; }
}
const arr = (v) => [+v.x.toFixed(5), +v.y.toFixed(5), +v.z.toFixed(5)];
const mouthReq = () => (DATA.mouth ? Object.fromEntries(MOUTH.map((k) => [k, arr(mouth[k])])) : null);
$('rebuild').onclick = () => send({ action: 'rebuild', reweight: $('reweight').value, mouth: mouthReq(),
  joints: Object.fromEntries([...mk.pts].map(([b, p]) => [b.name, arr(p)])),
  // (only the ends moved here or set before: a tip left alone keeps its bone's own way and length)
  ends: Object.fromEntries([...mk.ends].filter(([b, p]) => (DATA.ends && DATA.ends[b.name]) || p.distanceTo(mk.orig.ends.get(b)) > H * 1e-4).map(([b, p]) => [b.name, arr(p)])) }, $('jStatus'));
$('rejaw').onclick = () => send({ action: 'jaw', mouth: mouthReq() }, $('mStatus'));
// «View»: the pose turned by hand (the rings) made the rest - each bone's world turn from its rest (the jaw's own left out:
// it is made again from the mouth's marks)
const restW = new Map();
function poseTurns() {
  const out = {}, q = new THREE.Quaternion();
  bones.forEach((b) => {
    if (b.name === 'jaw' || !restW.has(b)) return;
    b.getWorldQuaternion(q);
    const d = q.clone().multiply(restW.get(b).clone().invert());
    if (2 * Math.acos(Math.min(1, Math.abs(d.w))) > 1e-3) out[b.name] = [d.x, d.y, d.z, d.w].map((x) => +x.toFixed(6));
  });
  return out;
}
$('keepPose').onclick = () => {
  const pose = poseTurns();
  if (!Object.keys(pose).length) { $('kStatus').textContent = '{{js:sv.keep_pose_none}}'; return; }
  send({ action: 'rest', pose }, $('kStatus'));
};
gizmo.addEventListener('objectChange', () => { if (EDIT && mode === 'view') $('keepPose').hidden = false; });
// (test hooks: work/wear_test/ui/test_creature_markup.mjs moves the marks the way the arrows would)
window.sv = { mouth, mk, bones, setMode, pickMark, mouthPaint, castRest, H: () => H, moveMark: (k, p) => {
  pickMark(k); helper.position.set(...p); helper.updateMatrixWorld(); gizmo.dispatchEvent({ type: 'objectChange' }); } };

// ---------------------------------------------------------------- views
function view(v) {
  const d = H * 1.9, c = center;
  const at = { front: [0, .15, 1], side: [1, .15, 0], top: [0, 1, .001], back: [0, .15, -1] }[v];
  camera.position.set(c.x + at[0] * d, c.y + at[1] * d, c.z + at[2] * d);
  camera.near = H / 500; camera.far = H * 50; camera.updateProjectionMatrix();
  controls.target.copy(c);
  controls.update();
  document.querySelectorAll('#views button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
}
document.querySelectorAll('#views button').forEach((b) => b.onclick = () => view(b.dataset.v));

// ---------------------------------------------------------------- every frame: the overlay follows the bones
const clock = new THREE.Clock();
const A = new THREE.Vector3(), B = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0), WHITE = new THREE.Color('#ffffff');
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (mixer && action && !action.paused) mixer.update(dt);
  controls.update();
  if (root) root.updateMatrixWorld(true);
  const showLabels = $('labels').checked, r = renderer.domElement.getBoundingClientRect();
  const marks = mode === 'joints';
  bones.forEach((b) => {
    const I = info.get(b);
    if (marks && mk.pts.has(b)) A.copy(mk.pts.get(b)); else b.getWorldPosition(A);
    I.sphere.position.copy(A);
    I.sphere.material.color.copy(b === selected ? WHITE : I.color);
    I.sphere.visible = !(marks && b.name === 'jaw');
    I.kids.forEach((k, j) => {
      if (marks && mk.pts.has(k)) B.copy(mk.pts.get(k)); else k.getWorldPosition(B);
      I.segs[j].visible = !(marks && k.name === 'jaw');
      const s = I.segs[j], len = A.distanceTo(B);
      s.position.copy(A).add(B).multiplyScalar(.5);
      s.quaternion.setFromUnitVectors(UP, B.clone().sub(A).normalize());
      s.scale.set(H * .0035, Math.max(len, 1e-6), H * .0035);
    });
    if (marks && I.endSphere) {   // a tip's end and the line to it
      const E = mk.ends.get(b), s = I.endSeg;
      I.endSphere.position.copy(E);
      s.position.copy(A).add(E).multiplyScalar(.5);
      s.quaternion.setFromUnitVectors(UP, E.clone().sub(A).normalize());
      s.scale.set(H * .0025, Math.max(A.distanceTo(E), 1e-6), H * .0025);
    }
    const lab = I.label;
    const show = showLabels && !/hand|face/.test(I.group) || b === selected;
    if (show) {
      const v = A.clone().project(camera);
      lab.hidden = v.z > 1;
      lab.style.left = ((v.x + 1) / 2 * r.width) + 'px';
      lab.style.top = ((1 - v.y) / 2 * r.height) + 'px';
    } else lab.hidden = true;
  });
  MOUTH.forEach((k) => { const s = mouthMarks[k]; if (s && mouth[k]) { s.position.copy(mouth[k]); s.scale.setScalar(H * .008); } });
  $('badge').textContent = mode !== 'view' ? (mk.sel ? markName(mk.sel) : '') : selected ? selected.name.replace(/^mixamorig\d*:?/i, '') : (DATA.badge || '');
  $('badge').hidden = !$('badge').textContent;
  renderer.render(scene, camera);
}
resize();
frame();
</script>
