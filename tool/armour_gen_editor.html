<!doctype html>
<html lang="{{raw:lang.code}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ag.editor_title}}</title>
<style>
  /* Embedded in the SF3D app (iframe srcdoc). The character with the piece left, the piece's parameters right. */
  :root { --bg:#ece8e1; --panel:#f6f3ee; --stage:#cfc8bc; --fg:#231d17; --muted:#6b6258; --line:#d0c9bd; --accent:#a8451d;
          --accent-fg:#fff6ec; --warn:#b5651d; --ui:"Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Consolas,monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15110d; --panel:#1e1913; --stage:#0f0c09;
    --fg:#eadfca; --muted:#a39580; --line:#352d23; --accent:#d9622f; --accent-fg:#1a0e06; --warn:#e0a050; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#15110d; --panel:#1e1913; --stage:#0f0c09; --fg:#eadfca; --muted:#a39580; --line:#352d23;
    --accent:#d9622f; --accent-fg:#1a0e06; --warn:#e0a050; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:13px/1.4 var(--ui); padding:10px; }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:10px; height:100%; min-height:560px; }
  @media (max-width: 760px) { .wrap { grid-template-columns:minmax(0,1fr); height:auto; } .stage { min-height:60vh; } }
  .main { display:flex; flex-direction:column; gap:8px; min-height:0; min-width:0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:6px 8px; }
  .stage { position:relative; flex:1; background:var(--stage); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-height:320px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .badge { position:absolute; left:10px; top:8px; font:12px var(--mono); color:var(--muted); background:color-mix(in srgb,var(--panel) 85%,transparent);
    padding:3px 8px; border-radius:6px; pointer-events:none; max-width:calc(100% - 20px); }
  .warn { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); max-width:92%; background:var(--warn); color:#fff;
    padding:6px 12px; border-radius:8px; font-weight:600; pointer-events:none; text-align:center; }
  .msg { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); padding:16px; text-align:center; }
  [hidden] { display:none !important; }
  .rail { display:flex; flex-direction:column; gap:8px; min-height:0; overflow:auto; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px; min-width:0; transition:border-color .15s; }
  .box.hot { border-color:var(--accent); }
  .grp { font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:2px 0 6px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .seg { display:inline-flex; flex-wrap:wrap; }
  .seg button { border-radius:0; margin-left:-1px; } .seg button:first-child { border-radius:7px 0 0 7px; margin-left:0; }
  .seg button:last-child { border-radius:0 7px 7px 0; }
  .pieces { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .pieces button { padding:6px 4px; }
  .sep { width:1px; align-self:stretch; background:var(--line); margin:0 2px; }
  .grow { flex:1; }
  button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:4px 9px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  button.primary { border-color:var(--accent); background:var(--accent); color:var(--accent-fg); font-weight:600; padding:7px 12px; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=number], select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; min-width:0; }
  .sl { display:grid; grid-template-columns:1fr auto; gap:0 8px; margin:6px 0; }
  .sl .lab { font-size:12.5px; }
  .sl .val { font:12px var(--mono); color:var(--accent); text-align:right; white-space:nowrap; }
  .sl input[type=range] { grid-column:1 / 3; width:100%; accent-color:var(--accent); margin:2px 0 0; }
  .sl .inf { grid-column:1 / 3; font-size:11.5px; color:var(--muted); }
  label.chk { display:flex; align-items:center; gap:6px; margin:6px 0; }
  .foot { position:sticky; bottom:0; box-shadow:0 -6px 8px -6px rgba(0,0,0,.25); }
  .status { font-size:12px; color:var(--muted); white-space:pre-wrap; margin-top:6px; max-height:9em; overflow:auto; }
  .note { font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="toolbar">
      <span class="seg" id="views">
        <button data-v="front">{{ag.view_front}}</button><button data-v="side">{{ag.view_side}}</button><button data-v="back">{{ag.view_back}}</button><button data-v="close">{{ag.view_close}}</button>
      </span>
      <span class="sep"></span>
      <span class="seg" id="skins" title="{{ag.skin_title}}">
        <button data-s="own" class="on">{{ag.skin_own}}</button><button data-s="plain">{{ag.skin_plain}}</button><button data-s="xray">{{ag.skin_xray}}</button>
      </span>
      <span class="sep"></span>
      <span class="seg" id="poses" title="{{ag.pose_title}}">
        <button data-p="rest" class="on">{{ag.pose_rest}}</button><button data-p="side">{{ag.pose_side}}</button><button data-p="front">{{ag.pose_front}}</button><button data-p="elbows">{{ag.pose_elbows}}</button><button data-p="squat">{{ag.pose_squat}}</button><button data-p="stride">{{ag.pose_stride}}</button><button data-p="fist">{{ag.pose_fist}}</button>
      </span>
      <span class="grow"></span>
      <span class="seg" id="shows" hidden>
        <button data-r="0" class="on">{{ag.show_preview}}</button><button data-r="1">{{ag.show_result}}</button>
      </span>
    </div>
    <div class="stage" id="stage">
      <div class="badge" id="info"></div>
      <div class="warn" id="warn" hidden></div>
      <div class="msg" id="msg">{{ag.loading_character}}</div>
    </div>
  </div>
  <div class="rail" id="rail">
    <div class="box">
      <div class="grp">{{ag.piece}}</div>
      <div class="pieces" id="pieces"></div>
      <div class="row" style="margin-top:8px" id="sidesRow">
        <span class="note">{{ag.sides}}:</span>
        <span class="seg"><button data-side="L" class="on">{{ag.left}}</button><button data-side="R" class="on">{{ag.right}}</button></span>
      </div>
      <div id="styleRow" style="margin-top:8px"><div class="note">{{ag.style}}</div><span class="seg" id="styleSeg"></span></div>
      <div class="row" style="margin-top:8px">
        <span class="note">{{ag.name}}</span><input type="text" id="name" class="grow">
      </div>
      <div id="wornRow" style="margin-top:8px" hidden><div class="note">{{ag.worn}}</div><div class="row" id="worn"></div></div>
      <div class="row" style="margin-top:6px" id="savedRow" hidden>
        <span class="note">{{ag.saved}}</span><select id="saved" class="grow"></select>
      </div>
    </div>
    <div id="groups"></div>
    <div class="box foot">
      <div class="row"><button class="primary grow" id="go">{{ag.generate}}</button><button id="room">{{ed.fitting_room_in_godot}}</button></div>
      <div class="status" id="status">{{ag.preview_note}}</div>
    </div>
  </div>
</div>
<script id="d-data" type="application/json">@@DATA@@</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
               "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { computeBoundsTree } from 'three-mesh-bvh';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;

// The piece is built here, from the character's own skin, on every change of a parameter, with its weights (the poses
// show it moving as in the game); «Generate» sends this very geometry and these weights to Blender, which bakes the
// textures and exports. The look of the material here is an approximation (the same colours, roughness and patterns;
// the bake adds the worn edges).
const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const DATA = JSON.parse($('d-data').textContent);
const PIECES = DATA.pieces;     // piece -> {joints: [first, next, main], foreign: [bone name words], part, defaults}
const PRESETS = DATA.presets;   // material -> [linear colour, roughness, metallic]
const PARTS = ['Eye_', 'EyeSocket', 'Teeth_', 'Gum_', 'Tongue', 'MouthCavity', 'Icosphere'];
const UP = new V3(0, 1, 0), FRONT = new V3(0, 0, 1);   // glTF: Y up, the character faces +Z
const TAU = 2 * Math.PI;

// ------------------------------------------------------------------ the scene
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#cfc8bc');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x554433, .6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 4, 3); scene.add(sun);
const backLight = new THREE.DirectionalLight(0xffffff, .9); backLight.position.set(-2, 3, -3); scene.add(backLight);   // the back is not black
const camera = new THREE.PerspectiveCamera(30, 1, .01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// the middle button pans the view, not the page (browser autoscroll); the wheel zooms, it does not scroll the app
const cnv = renderer.domElement;
cnv.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
cnv.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });
cnv.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ------------------------------------------------------------------ the character: skin for the rays, bones, poses
let charRoot = null, bodyGeo = null, vBone = null, vW = null, boneNames = [];
const PB = {}, REST = new Map(), byName = {}, ORIG = new Map();
const wordCache = new Map();

const fileUrl = (p) => new URL('/file=' + p, window.parent.location.href).href;
let charMeshes = [];
async function loadCharacter() {
  const gltf = await new GLTFLoader().loadAsync(fileUrl(DATA.rigged) + '?v=' + (DATA.rigged_v || 0));
  charRoot = gltf.scene; scene.add(charRoot); charRoot.updateMatrixWorld(true);
  const isPart = (o) => PARTS.some((p) => o.name.startsWith(p) || (o.parent && o.parent.name.startsWith(p)));
  charRoot.traverse((o) => {
    if (o.isBone) { byName[o.name] = o; REST.set(o, o.quaternion.clone()); boneNames.push(o.name); }   // every bone, an index each
    if (o.isMesh) { ORIG.set(o, o.material); if (o.geometry.index) o.userData.fullIndex = o.geometry.index.array.slice(); }
    if (o.isSkinnedMesh && !isPart(o) && o.geometry.attributes.skinIndex) charMeshes.push(o);
  });
  buildBody();
  if (!bodyGeo) throw new Error('{{js:blender.the_character_has_no_skin_with}}');
  bodyGeo.computeBoundingBox(); HEIGHT = bodyGeo.boundingBox.max.y - bodyGeo.boundingBox.min.y;
  for (const tbl of Object.values(DATA.names || {})) for (const [id, n] of Object.entries(tbl)) {
    const b = byName[THREE.PropertyBinding.sanitizeNodeName(n)] || byName[n]; if (b && !PB[id]) PB[id] = b;
  }
  if (!PB.hips) throw new Error('{{js:ag.bones_not_recognised}}');
  // the preview is skinned to the character's own bones, bound at rest
  BONES = boneNames.map((n) => byName[n]);
  SKEL = new THREE.Skeleton(BONES, BONES.map((b) => b.matrixWorld.clone().invert()));
}
// the order layers go on in, whichever is made first: trousers, a brayette over them, a skirt, a cuirass over the
// skirt's top («torso»: a breastplate fitted in «Armour»), pauldrons; a piece of a higher layer is over the new one
const LAYER = { undercloth: .5, trousers: 1, brayette: 2, tassets: 3, cuirass: 4, torso: 4, pauldron: 5 };
const isOuter = (w) => (S.piece === 'helmet' ? ['helmet', 'head'].includes(w.piece)   // a helmet: not over another
  : w.piece === 'elbow' ? ['bracer', 'rerebrace'].includes(S.piece)   // elbows go over the arm's pieces
    : (LAYER[w.piece] || 0) > (LAYER[S.piece] || 99));
// what the rays meet: the character's skin and the pieces put on under the new one (their rest pose, their weights);
// the ones over it apart (outerGeo): the new piece stays under them
let outerGeo = null, bodyFor = null;
function buildBody() {
  const pos = [], idx = [], vb = [], vw = [], id = new Map(boneNames.map((n, i) => [n, i])), v = new V3();
  const on = [...WORN.values()].filter((w) => w.on), meshes = [...charMeshes, ...on.filter((w) => !isOuter(w)).flatMap((w) => w.meshes)];
  bodyFor = S.piece;
  const op = [];
  for (const o of on.filter(isOuter).flatMap((w) => w.meshes)) {
    o.updateMatrixWorld(true);
    const P = o.geometry.attributes.position, full = o.geometry.index ? o.geometry.index.array : null;
    const pts = Array.from({ length: P.count }, (_, i) => v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld).toArray());
    if (full) for (const i of full) op.push(...pts[i]); else for (const q of pts) op.push(...q);
  }
  outerGeo = op.length ? new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(op, 3)) : null;
  if (outerGeo) outerGeo.computeBoundsTree();
  for (const o of meshes) {
    o.updateMatrixWorld(true);
    const g = o.geometry, P = g.attributes.position, si = g.attributes.skinIndex, sw = g.attributes.skinWeight;
    const bmap = o.skeleton.bones.map((b) => id.get(b.name) ?? 0), base = pos.length / 3;
    for (let i = 0; i < P.count; i++) {   // the rest pose: the raw positions in the world (as Blender's REST)
      v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld); pos.push(v.x, v.y, v.z);
      for (let k = 0; k < 4; k++) { vb.push(bmap[si.getComponent(i, k)]); vw.push(sw.getComponent(i, k)); }
    }
    const full = o.userData.fullIndex || (g.index && g.index.array);   // the whole body, whatever is hidden on screen
    if (full) for (let i = 0; i < full.length; i++) idx.push(base + full[i]);
    else for (let i = 0; i < P.count; i++) idx.push(base + i);
  }
  if (!pos.length) { bodyGeo = null; return; }
  bodyGeo = new THREE.BufferGeometry();
  bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); bodyGeo.setIndex(idx); bodyGeo.computeBoundsTree();
  vBone = Int32Array.from(vb); vW = Float32Array.from(vw);
  wordCache.clear(); profCache.clear(); limbCache.clear();
}
// pieces already put on: shown on the character's own bones; ticked ones the new piece is fitted over
const WORN = new Map();
async function wearPiece(w, on) {
  let e = WORN.get(w.item);
  if (!e) {
    const gltf = await new GLTFLoader().loadAsync(fileUrl(w.glb) + '?v=' + (w.v || Date.now()));
    const meshes = [];
    restPose();
    gltf.scene.traverse((o) => {
      if (o.isSkinnedMesh) { o.skeleton.bones = o.skeleton.bones.map((b) => byName[b.name] || b); o.frustumCulled = false; meshes.push(o); }
      if (o.isMesh) for (const mt of [].concat(o.material)) mt.side = THREE.DoubleSide;
    });
    scene.add(gltf.scene); gltf.scene.updateMatrixWorld(true);
    e = { root: gltf.scene, meshes, on: false, piece: w.piece, mask: w.mask ? await loadMask(w.mask) : null }; WORN.set(w.item, e);
  }
  e.on = on; e.root.visible = on;
  restPose(); buildBody(); hideBody(); changed('worn');
}
// what of the body a piece hides (<piece>.mask.json, made with it: tool/body_mask.py), as the game takes it away:
// the triangles whose three corners are hidden
async function loadMask(path) {   // positions in thousandths
  try { return new Set((await (await fetch(fileUrl(path) + '?t=' + Date.now())).json()).map((q) => q.join())); } catch (e) { return null; }
}
// a position in a mask: the nearest thousandth, and the next one too where a coordinate is near the cells' edge
// (Blender's import moves vertices by ~1e-5)
function inMask(m, x, y, z) {
  const opts = [x, y, z].map((v) => { const q = v * 1000, r = Math.round(q), f = q - r; return Math.abs(f) > .3 ? [r, r + Math.sign(f)] : [r]; });
  for (const a of opts[0]) for (const b of opts[1]) for (const c of opts[2]) if (m.has(`${a},${b},${c}`)) return true;
  return false;
}
let resultMask = null, previewMask = null;   // previewMask: what a helmet being chosen hides (the ears)
function hideBody() {
  const keys = [...[...WORN.values()].filter((w) => w.on && w.mask).map((w) => w.mask), ...(showResult && resultMask ? [resultMask] : []),
    ...(!showResult && previewMask ? [previewMask] : [])];
  for (const o of charMeshes) {
    const full = o.userData.fullIndex; if (!full) continue;
    if (!keys.length) { o.geometry.setIndex(new THREE.BufferAttribute(full, 1)); continue; }
    const P = o.geometry.attributes.position, hid = new Uint8Array(P.count);
    for (let i = 0; i < P.count; i++) {
      const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
      if (keys.some((m) => inMask(m, x, y, z))) hid[i] = 1;
    }
    const keep = [];
    for (let t = 0; t < full.length; t += 3) if (!(hid[full[t]] && hid[full[t + 1]] && hid[full[t + 2]])) keep.push(full[t], full[t + 1], full[t + 2]);
    o.geometry.setIndex(keep);
  }
}
const joint = (id) => (PB[id] ? PB[id].getWorldPosition(new V3()) : null);   // at rest: read before any pose

const _ray = new THREE.Ray();
function cast(o, d, far) {   // the skin's first hit from o along d (both sides of the faces, as Blender's ray_cast)
  _ray.origin.copy(o); _ray.direction.copy(d);
  const h = bodyGeo.boundsTree.raycastFirst(_ray, THREE.DoubleSide);
  return h && h.distance <= far ? h : null;
}
function castOuter(o, d, far) {   // the inner wall of the pieces worn over the new one
  if (!outerGeo) return null;
  _ray.origin.copy(o); _ray.direction.copy(d);
  const h = outerGeo.boundsTree.raycastFirst(_ray, THREE.DoubleSide);
  return h && h.distance <= far ? h : null;
}
function castAll(o, d, far) {   // every hit along the ray, nearest first
  _ray.origin.copy(o); _ray.direction.copy(d);
  return bodyGeo.boundsTree.raycast(_ray, THREE.DoubleSide).filter((h) => h.distance <= far).sort((a, b) => a.distance - b.distance);
}
function skinOf(h, words) {   // the share of a hit triangle's weight on the bones whose names have one of the words
  const key = words.join('|');
  let m = wordCache.get(key);
  if (!m) { m = Uint8Array.from(boneNames, (n) => (words.some((w) => n.includes(w)) ? 1 : 0)); wordCache.set(key, m); }
  let on = 0, tot = 0;
  for (const vi of [h.face.a, h.face.b, h.face.c]) for (let k = 0; k < 4; k++) { const w = vW[4 * vi + k]; tot += w; if (m[vBone[4 * vi + k]]) on += w; }
  return tot > 1e-9 ? on / tot : 0;
}

// ------------------------------------------------------------------ the limb, its skin profile, the shell
class Limb {
  constructor(a, b) {
    this.a = a.clone(); const d = b.clone().sub(a); this.len = d.length(); this.u = d.divideScalar(this.len);
    this.p1 = (Math.abs(this.u.x) < .9 ? new V3(1, 0, 0) : new V3(0, 1, 0)).cross(this.u).normalize();
    this.p2 = this.u.clone().cross(this.p1);
  }
  axis(t) { return this.a.clone().addScaledVector(this.u, t * this.len); }
  out(ang) { return this.p1.clone().multiplyScalar(Math.cos(ang)).addScaledVector(this.p2, Math.sin(ang)); }
  angOf(d) { return Math.atan2(d.dot(this.p2), d.dot(this.p1)); }
}
function centred(limb) {   // the joints sit off the middle of the flesh: a line through the skin's centres
  const centres = [];
  for (let i = 0; i < 9; i++) {
    const o = limb.axis(.1 + .8 * i / 8), hits = [];
    for (let k = 0; k < 24; k++) { const h = cast(o, limb.out(k / 24 * TAU), limb.len); if (h) hits.push(h.point.clone()); }
    if (hits.length >= 18) centres.push(hits.reduce((s, p) => s.add(p), new V3()).divideScalar(hits.length));
  }
  if (centres.length < 3) return limb;
  const c = centres.reduce((s, p) => s.add(p.clone()), new V3()).divideScalar(centres.length);
  let d = limb.u.clone();
  for (let it = 0; it < 20; it++) {
    const w = new V3(); for (const p of centres) { const q = p.clone().sub(c); w.addScaledVector(q, q.dot(d)); }
    if (w.length() < 1e-12) break; d = w.normalize();
  }
  if (d.dot(limb.u) < 0) d.negate();
  if (d.dot(limb.u) < .9) d = limb.u.clone();
  const b = limb.axis(1);
  return new Limb(c.clone().addScaledVector(d, limb.a.clone().sub(c).dot(d)), c.clone().addScaledVector(d, b.clone().sub(c).dot(d)));

  if (!whole && helmetObj) box.expandByObject(helmetObj);
  if (whole === 'head' && joint('head')) {   // the head (a helmet on it)
    const J = joint('head'), r = .12 * HEIGHT;
    box.set(new V3(J.x - r, J.y - .3 * r, J.z - r), new V3(J.x + r, J.y + 1.5 * r, J.z + r));
  }
  if (box.isEmpty()) box.setFromObject(charRoot || scene);
  const c = box.getCenter(new V3()), size = Math.max(box.getSize(new V3()).length(), 1e-3);
  const eye = (eyeOver ? new V3(...eyeOver) : { front: new V3(0, .12, 1), side: new V3(1, .12, .35), back: new V3(0, .12, -1), close: new V3(.55, .25, 1) }[v]).normalize();
  const k = v === 'close' ? 1.1 : 1.35;
  const dist = k * size / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.position.copy(c).addScaledVector(eye, dist); controls.target.copy(c); camera.near = dist / 100; camera.far = dist * 100; camera.updateProjectionMatrix();
  curView = v;
  for (const b of $('views').children) b.classList.toggle('on', b.dataset.v === v);
}
const plainMat = new THREE.MeshStandardMaterial({ color: 0x8c9670, roughness: .8 });
const xrayMat = new THREE.MeshStandardMaterial({ color: 0x8c9670, roughness: .8, transparent: true, opacity: .3, depthWrite: false });
function skin(s) {
  for (const [o, m] of ORIG) o.material = s === 'own' ? m : s === 'plain' ? plainMat : xrayMat;
  for (const b of $('skins').children) b.classList.toggle('on', b.dataset.s === s);
}
$('views').addEventListener('click', (e) => e.target.dataset.v && view(e.target.dataset.v));
window.agView = (v, eye, whole) => view(v, eye, whole);
$('skins').addEventListener('click', (e) => e.target.dataset.s && skin(e.target.dataset.s));
$('poses').addEventListener('click', (e) => {
  if (!e.target.dataset.p) return;
  pose = e.target.dataset.p; for (const b of $('poses').children) b.classList.toggle('on', b === e.target); applyPose();
});
$('shows').addEventListener('click', (e) => e.target.dataset.r && setShow(e.target.dataset.r === '1'));
function setShow(r) {
  showResult = r && !!resultRoot;
  pieceGroup.visible = !showResult; if (resultRoot) resultRoot.visible = showResult;
  hideBody();
  for (const b of $('shows').children) b.classList.toggle('on', (b.dataset.r === '1') === showResult);
}

// ------------------------------------------------------------------ to SF3D: the geometry, weights and materials, answered by a status file
function listWorn() {   // the pieces already on the character, a tick each
  $('wornRow').hidden = !DATA.worn.length;
  $('worn').innerHTML = DATA.worn.map((w, i) => `<label class="chk" style="margin:2px 8px 2px 0"><input type="checkbox" data-w="${i}" ${WORN.get(w.item) && WORN.get(w.item).on ? 'checked' : ''}> ${w.item}</label>`).join('');
}
const b64 = (ta) => { const u = new Uint8Array(ta.buffer, ta.byteOffset, ta.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
function payload() {   // every part in one mesh: positions (glTF axes), faces (sizes, vertices, material slots), texture
  const v = [], uv = [], bi = [], bw = [], sizes = [], f = [], m = [];   // coordinates of the pattern, the weights by bone
  for (const part of parts) {
    const a = part.acc, base = v.length / 3;
    for (const [to, from] of [[v, a.v], [uv, a.uv], [bi, a.bi], [bw, a.bw]]) for (const x of from) to.push(x);   // no spread: too many
    a.f.forEach((q, k) => { sizes.push(q.length); for (const i of q) f.push(base + i); m.push(a.m[k]); });
  }
  return { v: b64(Float32Array.from(v)), uv: b64(Float32Array.from(uv)), n: b64(Uint8Array.from(sizes)), f: b64(Uint32Array.from(f)),
    m: b64(Uint8Array.from(m)), bi: b64(Uint16Array.from(bi)), bw: b64(Float32Array.from(bw)), bones: boneNames,
    mats: LOOK.specs, patterns: { mail: patternTile('mail').png, quilt: patternTile(quiltTile(S.p)).png }, pattern_unit: LOOK.U,
    radius: parts.reduce((s, x) => s + x.R, 0) / parts.length, over_clothes: parts.some((x) => x.loose) };
}
let busy = false;
async function send(action, extra, wait, statusName) {
  const req = Object.assign({ id: Date.now(), action, rigged: DATA.rigged }, extra);
  try {
    const ta = window.parent.document.querySelector('#' + DATA.target + ' textarea');
    ta.value = JSON.stringify(req); ta.dispatchEvent(new Event('input', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 400));
    window.parent.document.querySelector('#' + DATA.go).click();
  } catch (e) { $('status').textContent = '{{js:ed.could_not_send_to_sf3d}}' + e.message; return null; }
  $('status').textContent = wait;
  const status = DATA.rigged.replace(/[^/]*$/, '') + DATA.stem + statusName + '.wear.json';
  for (let k = 0; k < 600; k++) {
    await new Promise((r) => setTimeout(r, 1500));
    let js = null;
    try { const r = await fetch(fileUrl(status) + '?t=' + Date.now()); if (r.ok) js = await r.json(); } catch (e) { /* not yet */ }
    if (!js || js.id !== req.id) continue;
    $('status').textContent = js.log;
    return js;
  }
  $('status').textContent = '{{js:ed.sf3d_did_not_answer_see_the_armour}}';
  return null;
}
const itemName = () => (S.name || 'proc_' + S.piece).trim().replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'proc_' + S.piece;
$('go').addEventListener('click', async () => {
  if (!lastBuild || busy) return;
  busy = true; $('go').disabled = true;
  const item = itemName();
  if (WORN.get(item) && WORN.get(item).on) { await wearPiece(DATA.worn.find((w) => w.item === item), false); listWorn(); }   // not over itself
  let js = null;
  try {
    js = await send('generate', { item, piece: S.piece, sides: lastBuild.sides.filter((s) => s !== 'C'),
      params: { ...S.p }, mesh: isMade() ? null : payload(), under: [...WORN.entries()].filter(([, w]) => w.on).map(([k]) => k) }, '{{js:ag.working}}', '_wear_' + item);
  } catch (e) { $('status').textContent = '{{js:ed.could_not_send_to_sf3d}}' + e.message; console.error(e); }
  busy = false; $('go').disabled = !lastBuild;
  if (js && js.ok) {
    const i = DATA.saved.findIndex((x) => x.item === item);
    const entry = { item, piece: S.piece, sides: [...S.sides], params: { ...S.p } };
    if (i >= 0) DATA.saved[i] = entry; else DATA.saved.push(entry);
    listSaved(item);
    const old = WORN.get(item); if (old) { scene.remove(old.root); WORN.delete(item); }   // its old look goes
    if (!DATA.worn.some((w) => w.item === item)) DATA.worn.push({ item, glb: js.glb, v: Date.now(), piece: S.piece });
    else Object.assign(DATA.worn.find((w) => w.item === item), { v: Date.now(), piece: S.piece });
    listWorn();
    resultMask = js.mask ? await loadMask(js.mask) : null;
    const wi = DATA.worn.find((w) => w.item === item); if (wi) wi.mask = js.mask;
    await loadResult(js.glb);
  }
});
$('room').addEventListener('click', () => send('wardrobe', {}, '{{js:ag.opening_room}}', '_wardrobe'));
async function loadResult(glb) {   // the baked piece, on the character's own bones (it follows the poses)
  if (resultRoot) { scene.remove(resultRoot); resultRoot = null; }
  try {
    const gltf = await new GLTFLoader().loadAsync(fileUrl(glb) + '?t=' + Date.now());
    resultRoot = gltf.scene;
    resultRoot.traverse((o) => {
      if (o.isSkinnedMesh) { o.skeleton.bones = o.skeleton.bones.map((b) => byName[b.name] || b); o.frustumCulled = false; }
      if (o.isMesh) for (const mt of [].concat(o.material)) mt.side = THREE.DoubleSide;
    });
    scene.add(resultRoot);
    $('shows').hidden = false; setShow(true);
  } catch (e) { console.error(e); }
}
function listSaved(sel) {
  $('savedRow').hidden = !DATA.saved.length;
  $('saved').innerHTML = `<option value="">{{js:ag.saved_new}}</option>` + DATA.saved.map((x, i) => `<option value="${i}">${x.item} — ${LABEL[x.piece] || x.piece}</option>`).join('');
  $('saved').value = sel ? String(DATA.saved.findIndex((x) => x.item === sel)) : '';
}
$('saved').addEventListener('change', (e) => {
  const x = DATA.saved[+e.target.value]; if (e.target.value === '' || !x) return;
  S.p = { ...DEFAULTS, ...PIECES[x.piece].defaults, ...x.params }; S.sides = x.sides && x.sides.length ? [...x.sides] : ['L', 'R'];
  S.name = x.item; S.nameTouched = true; setPiece(x.piece, true);
});

// ------------------------------------------------------------------ start
buildPanel(); syncPanel(); listSaved(); listWorn();
$('worn').addEventListener('change', (e) => { const i = e.target.dataset.w; if (i !== undefined) wearPiece(DATA.worn[+i], e.target.checked).catch((er) => console.error(er)); });
try {
  await loadCharacter();
  $('msg').hidden = true;
  rebuild();
} catch (e) { $('msg').textContent = e.message; console.error(e); }
</script>
